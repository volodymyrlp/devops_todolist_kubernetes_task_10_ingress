apiVersion: v1
kind: Pod
metadata:
  name: todoapp-pod
  namespace: todoapp
  labels:
    app: todoapp
spec:
  containers:
  - name: todoapp
    image: ikulyk404/todoapp:4.0.1
    ports:
    - containerPort: 8080
    env:
    - name: PYTHONUNBUFFERED
      valueFrom:
        configMapKeyRef:
          name: app-config
          key: PYTHONUNBUFFERED
    - name: SECRET_KEY
      valueFrom:
        secretKeyRef:
          name: app-secret
          key: SECRET_KEY
    - name: DB_NAME
      valueFrom:
        secretKeyRef:
          name: app-secret
          key: DB_NAME
    - name: DB_USER
      valueFrom:
        secretKeyRef:
          name: app-secret
          key: DB_USER
    - name: DB_PASSWORD
      valueFrom:
        secretKeyRef:
          name: app-secret
          key: DB_PASSWORD
    - name: DB_HOST
      valueFrom:
        secretKeyRef:
          name: app-secret
          key: DB_HOST
    livenessProbe:
      httpGet:
        path: api/health
        port: 8080
      initialDelaySeconds: 60
      periodSeconds: 5
    readinessProbe:
      httpGet:
        path: api/ready
        port: 8080
      initialDelaySeconds: 5
      periodSeconds: 5
    volumeMounts:
    - name: data
      mountPath: /app/data
    - name: app-secrets-volume
      mountPath: /app/secrets
      readOnly: true
    - name: app-config-volume
      mountPath: /app/configs
      readOnly: true
  volumes:
  - name: data
    persistentVolumeClaim:
      claimName: pvc-data
  - name: app-secrets-volume
    secret:
      secretName: app-secret
  - name: app-config-volume
    configMap:
      name: app-config
